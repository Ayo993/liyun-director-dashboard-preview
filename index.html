 ${kpi('整体结业率',fmt(d.graduationRate,1),'%',`已结业 ${fmt(d.graduated.length)} 人次`,'school',"showMetric('graduation')",false,delta(d.graduationRate,old.graduationRate,true))}</section>

 <div class="grid12"><section class="panel span8">${panelHead('研修投入与覆盖趋势','按自然月汇总，点击柱形查看当月项目贡献',`<div class="seg"><button class="${state.trend==='hours'?'active':''}" onclick="setTrend('hours')">学习学时</button><button class="${state.trend==='people'?'active':''}" onclick="setTrend('people')">参训人次</button></div>`)}<div class="chart-topline"><span><i class="legend-dot"></i>${state.trend==='hours'?'月学习学时':'月新增参训人次'}</span><span>年度累计 <strong class="blue">${state.trend==='hours'?fmt(d.hours)+' 学时':fmt(d.enrolments)+' 人次'}</strong></span></div><div class="chart-wrap">${trendChart(d)}</div></section>

 <div class="grid12"><section class="panel span4">${panelHead('服务地区分布','按参训人次统计',`<button class="text-link" onclick="navigate('regions')">区域台账 ${icon('arrow')}</button>`)}<div class="regions">${provinceRows(d)}</div></section>
 <section class="panel span4">${panelHead('学科覆盖结构','按去重学员的主学科统计')}${subjectRows(d)}<div class="age-foot">一人一主学科，点击查看对应学员</div></section>
 <section class="panel span4">${panelHead('学员年龄结构','按所选年度末年龄分组')}<div class="age-layout">${ageChart(d)}</div><div class="age-foot">年龄信息完整率 100% · 演示样本</div></section></div>

}
function mini(label,value,unit,i,action){return`<button class="mini-stat" onclick="${action}"><div class="mini-label">${icon(i)}${label}</div><div class="mini-value"><b class="num">${value}</b><span>${unit}</span></div></button>`}
function trendChart(d){let values=state.trend==='hours'?d.monthly:Array.from({length:d.monthly.length},(_,m)=>sum(d.projects,p=>p.monthEnroll[m]||0));const max=Math.max(1,...values)*1.18,w=700,h=190,left=45,right=8,bottom=28,plot=h-bottom,step=(w-left-right)/values.length;let svg=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="月度研修趋势">`;for(let i=0;i<4;i++){const y=plot-i*plot/3;svg+=`<line x1="${left}" x2="${w-right}" y1="${y}" y2="${y}" stroke="#edf1f7" ${i?'stroke-dasharray="3 4"':''}/><text x="${left-10}" y="${y+4}" text-anchor="end" fill="#a0adbe" font-size="10">${fmt(max*i/3)}</text>`}values.forEach((v,i)=>{let x=left+i*step+step*.23,bh=v/max*(plot-8);svg+=`<g class="chart-click" role="button" tabindex="0" aria-label="查看${i+1}月数据" onclick="showMonth(${i})" onkeydown="if(event.key==='Enter')showMonth(${i})"><title>${i+1}月：${fmt(v)}${state.trend==='hours'?'学时':'人次'}</title><rect x="${x}" y="${plot-bh}" width="${step*.54}" height="${Math.max(v?2:0,bh)}" fill="${i===values.length-1?'#2f6ed4':'#a9c4f3'}" rx="3"/><text x="${x+step*.27}" y="${h-6}" fill="#93a2b5" text-anchor="middle" font-size="10">${i+1}月</text></g>`});return svg+'</svg>'}
function setTrend(t){state.trend=t;render()}
function provinceRows(d){const rows=provinces.map(p=>({name:p,n:d.members.filter(x=>x.project.province===p).length})).sort((a,b)=>b.n-a.n),max=Math.max(1,...rows.map(x=>x.n));return rows.map((r,i)=>`<button class="region-row" onclick="applyProvince('${r.name}')"><span>${r.name}</span><div class="bar-track"><div class="bar-fill" style="width:${r.n/max*100}%;background:${i<2?'#4b83df':'#b1c9ef'}"></div></div><strong>${fmt(r.n)}</strong>${icon('arrow')}</button>`).join('')}
function subjectRows(d){const subjects=['语文','数学','英语','科学','综合实践','艺术'],rows=subjects.map(s=>({s,n:d.people.filter(x=>x.subject===s).length})).sort((a,b)=>b.n-a.n);return rows.map((r,i)=>`<div class="rank-row"><span class="rank-index ${i<3?'top':''}">0${i+1}</span><button style="text-align:left;padding:0" onclick="showPeopleSubset('subject','${r.s}')">${r.s}</button><button class="bar-track" onclick="showPeopleSubset('subject','${r.s}')" aria-label="查看${r.s}学员"><div class="bar-fill" style="width:${ratio(r.n,d.people.length)}%;background:${i?'#9cbeed':'#4d83d9'}"></div></button><strong>${fmt(ratio(r.n,d.people.length),1)}%</strong></div>`).join('')}
const ageGroup=(age)=>age<=30?'30岁及以下':age<=40?'31—40岁':age<=50?'41—50岁':'51岁及以上';
const ageFor=(p)=>p.age+Number(state.year)-2026;
function ageChart(d){const labels=['30岁及以下','31—40岁','41—50岁','51岁及以上'],counts=labels.map(s=>d.people.filter(p=>ageGroup(ageFor(p))===s).length),circ=2*Math.PI*49;let offset=0;const arcs=counts.map((n,i)=>{const v=ratio(n,d.participants)/100*circ,part=`<circle cx="65" cy="65" r="49" fill="none" stroke="${palette[i]}" stroke-width="13" stroke-dasharray="${v} ${circ-v}" stroke-dashoffset="${-offset}"/>`;offset+=v;return part}).join('');return`<div class="donut"><svg viewBox="0 0 130 130" role="img" aria-label="年龄结构占比"><circle cx="65" cy="65" r="49" fill="none" stroke="#eef2f8" stroke-width="13"/>${arcs}</svg><div class="donut-center"><b class="num">${fmt(d.participants)}</b><span>覆盖学员 / 人</span></div></div><div class="age-legend">${labels.map((s,i)=>`<button onclick="showPeopleSubset('age','${s}')"><span><i style="background:${palette[i]}"></i>${s}</span><strong>${fmt(ratio(counts[i],d.participants),1)}%</strong></button>`).join('')}</div>`}
function statusPill(p){return`<span class="pill ${p.status==='已结班'?'good':p.status==='延期'?'bad':p.status==='筹备中'?'neutral':''}">${p.status}</span>`}
function healthHtml(p){if(p.health===null)return'<span class="muted">未开班</span>';return`<span class="health ${p.health<70?'bad':p.health<=85?'warn':''}"><i></i>${p.health}</span>`}
function filteredProjects(d){return d.projects.filter(p=>(state.projectTab==='all'||(state.projectTab==='attention'&&p.health!==null&&p.health<=85)||(state.projectTab==='closed'&&p.status==='已结班'))&&(!state.search||[p.name,p.id,p.province,p.client].join('').toLowerCase().includes(state.search.toLowerCase()))).sort((a,b)=>(a.health===null?101:a.health)-(b.health===null?101:b.health));}
function projectPanel(d,compact=false){const list=filteredProjects(d),size=compact?5:8,pages=Math.ceil(list.length/size)||1;state.page=Math.min(state.page,pages);const shown=list.slice((state.page-1)*size,state.page*size);return`<section class="panel table-panel"><div class="panel-head"><div><div class="panel-title"><h2>项目进度与健康度</h2><span class="count-badge">${d.projects.length} 个项目</span></div><p class="sub">健康度：&lt;70 需关注 · 70—85 待跟进 · &gt;85 执行良好</p></div><button class="btn" onclick="exportProjects()">${icon('download')}导出明细</button></div><div class="table-tools"><div class="tabs"><button class="${state.projectTab==='all'?'active':''}" onclick="setProjectTab('all')">全部项目</button><button class="${state.projectTab==='attention'?'active':''}" onclick="setProjectTab('attention')">需关注 / 待跟进</button><button class="${state.projectTab==='closed'?'active':''}" onclick="setProjectTab('closed')">已结班</button></div><label class="search">${icon('search')}<input aria-label="搜索项目" placeholder="搜索项目名称或编号" value="${safe(state.search)}" oninput="searchProjects(this.value)"></label></div><div id="projectTable">${projectTable(shown)}</div><div class="pagination"><span>共 ${list.length} 个项目 · 第 ${state.page} / ${pages} 页</span><div class="page-buttons"><button onclick="projectPageChange(-1)" ${state.page===1?'disabled':''} aria-label="上一页">‹</button>${Array.from({length:pages},(_,i)=>`<button class="${state.page===i+1?'active':''}" onclick="setPage(${i+1})">${i+1}</button>`).join('')}<button onclick="projectPageChange(1)" ${state.page===pages?'disabled':''} aria-label="下一页">›</button></div></div></section>`}
function projectTable(ps){if(!ps.length)return'<div class="empty"><strong>当前范围暂无匹配项目</strong>请调整客户类型、部门、地区或搜索条件。</div>';return`<div class="table-scroll"><table><thead><tr><th>项目名称 / 编号</th><th>客户类型</th><th>状态</th><th>参训人数</th><th>学时完成率</th><th>考核合格率</th><th>健康度</th><th>关注事项</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td><button class="project-name" onclick="showProject('${p.id}')">${safe(p.name)}</button><div class="table-code">${p.id} · ${p.province}</div></td><td>${p.type}</td><td>${statusPill(p)}</td><td class="num">${fmt(p.learners.length)}</td><td><div class="progress-cell"><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,p.completion)}%;background:${p.health!==null&&p.health<70?'#df9197':'#6c97dc'}"></div></div><span>${fmt(p.completion,1)}%</span></div></td><td class="num">${p.exam?pct(p.passRate):'—'}</td><td>${healthHtml(p)}</td><td><div class="risk-reason">${p.risk}</div></td><td><button class="text-link" onclick="showProject('${p.id}')">查看 ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>`}
function setProjectTab(t){state.projectTab=t;state.page=1;render()}
function searchProjects(v){state.search=v;state.page=1;const active=document.activeElement;const start=active.selectionStart;render();const input=document.querySelector('input[aria-label="搜索项目"]');if(input){input.focus();input.setSelectionRange(start,start)}}
function setPage(p){state.page=p;render()}function projectPageChange(n){state.page+=n;render()}
function showAttention(){state.view='projects';state.projectTab='attention';state.page=1;state.search='';render();window.scrollTo({top:0,behavior:'smooth'})}
function projectPage(d){return`<div class="section-kpis">${smallStat('项目总数',d.projects.length+' 个')}${smallStat('需关注项目',d.projects.filter(p=>p.health!==null&&p.health<70).length+' 个')}${smallStat('待跟进项目',d.projects.filter(p=>p.health!==null&&p.health>=70&&p.health<=85).length+' 个')}${smallStat('年度累计有效学时',fmt(d.hours)+' 学时')}</div>${projectPanel(d)}`}
function smallStat(label,val){return`<div class="small-kpi"><span>${label}</span><b class="num">${val}</b></div>`}
function regionPage(d){const rows=provinces.filter(p=>!state.province||state.province===p).map(province=>{const s=stats(d.projects.filter(p=>p.province===province));return`<tr><td><button class="project-name" onclick="showRegion('${province}')">${province}</button></td><td>${s.projects.length}</td><td>${s.county.length}</td><td>${s.schools.length}</td><td>${fmt(s.participants)}</td><td>${fmt(s.enrolments)}</td><td>${fmt(s.hours)}</td><td>${s.exam.length?pct(s.passRate):'—'}</td><td><button class="text-link" onclick="showRegion('${province}')">区县与单位明细 ${icon('arrow')}</button></td></tr>`});return`<div class="section-kpis">${smallStat('覆盖省份',d.regions.length+' 个')}${smallStat('覆盖区县',d.county.length+' 个')}${smallStat('覆盖学校 / 单位',d.schools.length+' 所')}${smallStat('送教与入校指导',d.activities+' 场')}</div><section class="panel table-panel"><div class="panel-head"><div class="panel-title"><h2>分省服务台账</h2></div><button class="btn" onclick="exportRegions()">${icon('download')}导出区域台账</button></div><div class="table-scroll"><table><thead><tr><th>省份</th><th>项目数</th><th>区县数</th><th>学校 / 单位数</th><th>去重学员</th><th>参训人次</th><th>有效学时</th><th>考核合格率</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div><div class="pagination">点击省份查看区县、单位及对应人员。</div></section>`}
function dedupMembers(ms){const map=new Map();ms.forEach(m=>{if(!map.has(m.person.id))map.set(m.person.id,{person:m.person,records:[]});map.get(m.person.id).records.push(m)});return[...map.values()]}

function openModal(title,sub,body){const overlay=document.getElementById('overlay'),already=!overlay.classList.contains('hidden');if(!already)focusBeforeModal=document.activeElement;document.getElementById('modal').innerHTML=`<div class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${sub}</p></div><button class="close-btn" onclick="closeModal()" aria-label="关闭弹窗">${icon('close')}</button></div><div class="modal-body">${body}</div>`;overlay.classList.remove('hidden');document.body.style.overflow='hidden';document.getElementById('modal').scrollTop=0;document.getElementById('modal').focus()}
function closeModal(){document.getElementById('overlay').classList.add('hidden');document.body.style.overflow='';if(focusBeforeModal&&document.contains(focusBeforeModal))focusBeforeModal.focus()}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(document.getElementById('overlay').classList.contains('hidden'))return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeModal();}if(e.key==='Tab'){const els=[...document.querySelectorAll('#modal button,#modal select,#modal input,#modal a')].filter(el=>!el.disabled&&el.offsetParent!==null);if(!els.length){e.preventDefault();return}const first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement.id==='modal')){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

 if(tab==='overview')body+=`<section class="panel"><div class="panel-head"><h3>项目基本信息</h3>${statusPill(p)}</div><div class="detail-grid">${detail('委托甲方',p.client)}${detail('客户类型',p.type)}${detail('负责部门',p.department)}${detail('项目计划周期',`${p.year}.${String(p.start).padStart(2,'0')}.01 — ${p.year}.${String(p.end).padStart(2,'0')}.30`)}${detail('个人应修学时',p.required+' 学时')}${detail('人均已完成学时',fmt(p.hours/(p.active||1),1)+' 学时（已激活口径）')}${detail('授课专家',p.experts.length+' 人')}${detail('直播场次',p.live+' 场')}${detail('送教 / 入校指导',p.activities+' 场')}${detail('满意度',fmt(p.satisfaction,2)+' / 5')}${detail('考核合格率',p.exam?pct(p.passRate):'暂无参考记录')}${detail('已发证记录',p.graduated+' 条')}</div></section><section class="panel"><div class="panel-head"><h3>需跟进事项</h3><button class="text-link" onclick="showProject('${id}','learners','incomplete')">查看未达标名单 ${icon('arrow')}</button></div><div class="note-box">${p.status==='筹备中'?'项目尚未开班，当前学习指标为零，健康度暂不评级。':`${p.learners.filter(x=>x.hours<x.required).length} 名学员尚未达到学时要求，${p.learners.length-p.active} 名学员尚未激活账号。建议项目负责人核对参训名单与学习进度。`}</div><p class="sub">关注事项根据演示数据规则生成。此原型不发送真实催学消息。</p></section>`;
 else body+=`<section class="panel table-panel"><div class="panel-head"><h3>学员学情明细</h3><button class="btn" onclick="downloadCSV('项目学情明细',memberHeaders,modalExportRows)">${icon('download')}导出当前名单</button></div><div class="table-tools"><div class="tabs"><button class="${filter==='all'?'active':''}" onclick="showProject('${id}','learners','all')">全部 ${p.learners.length}</button><button class="${filter==='incomplete'?'active':''}" onclick="showProject('${id}','learners','incomplete')">学时未达标</button><button class="${filter==='inactive'?'active':''}" onclick="showProject('${id}','learners','inactive')">未激活</button></div><span class="sub">共 ${ls.length} 人</span></div>${memberTable(ls,id)}</section>`;

function detail(label,value){return`<div class="detail-item"><label>${label}</label><strong>${safe(value)}</strong></div>`}
function memberTable(ls,id=''){if(!ls.length)return'<div class="empty">当前条件下暂无学员。</div>';return`<div class="table-scroll"><table><thead><tr><th>学员</th><th>单位</th><th>账号状态</th><th>已完成 / 应修</th><th>学时进度</th><th>考核成绩</th><th>证书</th><th></th></tr></thead><tbody>${ls.map(m=>`<tr><td><button class="project-name" onclick="showPerson(${m.person.id},'${id}')">${m.person.name}</button><div class="table-code">${m.person.phone}</div></td><td>${m.person.school}</td><td><span class="pill ${m.active?'good':'neutral'}">${m.active?'已激活':'未激活'}</span></td><td>${fmt(m.hours,1)} / ${m.required}</td><td>${pct(ratio(m.hours,m.required))}</td><td>${m.exam?m.score:'未参考'}</td><td>${m.certificate?'已获证':'未获证'}</td><td><button class="text-link" onclick="showPerson(${m.person.id},'${id}')">档案 ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div>`}
function showPerson(id,projectId=''){const p=allPeople.get(id);const records=selected().flatMap(p=>p.learners).filter(m=>m.person.id===id);const cert=records.filter(m=>m.certificate).length;let body=`${projectId?`<button class="back-link" onclick="showProject('${projectId}','learners')">${icon('back')}返回项目学员名单</button>`:''}<section class="panel"><div class="profile-top"><div class="profile-avatar">${p.name.slice(0,1)}</div><div><h3>${p.name} <span class="pill good">演示学员</span></h3><div class="profile-meta">${p.code}　${p.phone}<br>${p.province} · ${p.school}　${p.level} / ${p.subject}　${ageFor(p)} 岁</div></div></div></section><div class="section-kpis">${smallStat('当前范围参训项目',records.length+' 个')}${smallStat('累计有效学时',fmt(sum(records,x=>x.hours),1))}${smallStat('已获证书',cert+' 份')}${smallStat('完成课程记录',sum(records,x=>x.completedCourses)+' 门次')}</div><section class="panel table-panel"><div class="panel-head"><h3>项目学习记录</h3><button class="btn" onclick="exportPerson(${id})">${icon('download')}导出培训记录</button></div><div class="table-scroll"><table><thead><tr><th>项目</th><th>有效 / 应修学时</th><th>考核成绩</th><th>学习状态</th><th>证书</th></tr></thead><tbody>${records.map(m=>`<tr><td><button class="project-name" onclick="showProject('${m.project.id}')">${m.project.name}</button></td><td>${fmt(m.hours,1)} / ${m.required}</td><td>${m.exam?m.score:'未参考'}</td><td>${m.graduated?'<span class="pill good">已结业</span>':m.hours?'<span class="pill warn">学习中</span>':'<span class="pill neutral">未开始</span>'}</td><td>${m.certificate?`<button class="text-link" onclick="showCertificate(${id},'${m.project.id}')">查看证书</button>`:'未获证'}</td></tr>`).join('')}</tbody></table></div></section><div class="note-box">档案仅汇总当前年度、客户类型、部门与地区筛选范围内的培训记录。全部姓名、联系方式和证书均为虚构演示内容。</div>`;openModal('学员培训档案','个人学习情况与项目参与记录',body)}
function showCertificate(id,pid){const p=findProject(pid),person=allPeople.get(id);openModal('结业证书预览','演示证书 · 不作为真实培训证明',`<button class="back-link" onclick="showPerson(${id},'${pid}')">${icon('back')}返回学员档案</button><div class="report" style="text-align:center;border:8px double #c8d7ed;padding:55px 30px"><div class="report-brand">励耘研修 · 结业证明</div><h2 style="margin-bottom:25px;letter-spacing:5px">结业证书</h2><p style="font-size:15px">${person.name} 参加“${p.name}”研修，<br>完成规定学习任务及考核，准予结业。</p><p style="margin-top:30px">证书编号：DEMO-${pid}-${person.code}</p><p>本页为原型演示，不具备证明效力。</p></div>`)}
function showRegion(province){const ps=selected().filter(p=>p.province===province),d=stats(ps),rows=counties[province].map(c=>{const ms=d.members.filter(m=>m.person.county===c),active=ms.filter(m=>m.active).length,exam=ms.filter(m=>m.exam).length;return`<tr><td>${c}</td><td>${unique(ms.map(m=>m.person.school)).length}</td><td>${unique(ms.map(m=>m.person.id)).length}</td><td>${ms.length}</td><td>${fmt(ratio(active,ms.length),1)}%</td><td>${fmt(sum(ms,m=>m.hours),1)}</td><td>${exam?pct(ratio(ms.filter(m=>m.passed).length,exam)):'—'}</td><td><button class="text-link" onclick="showCounty('${province}','${c}')">单位明细 ${icon('arrow')}</button></td></tr>`});openModal(province+' · 区县培训台账',`${ps.length} 个项目 · ${d.county.length} 个区县 · ${scopeText()}`,`<div class="section-kpis">${smallStat('覆盖学员',fmt(d.participants))}${smallStat('参训人次',fmt(d.enrolments))}${smallStat('有效学时',fmt(d.hours))}${smallStat('送教场次',d.activities)}</div><section class="panel table-panel"><div class="panel-head"><h3>区县覆盖及学情</h3></div><div class="table-scroll"><table><thead><tr><th>区县</th><th>单位数</th><th>去重学员</th><th>人次</th><th>激活率</th><th>有效学时</th><th>考核合格率</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>`)}
function showCounty(province,county){const ms=selected().filter(p=>p.province===province).flatMap(p=>p.learners).filter(m=>m.person.county===county),schools=unique(ms.map(m=>m.person.school));openModal(county+' · 单位明细',province+' · 当前筛选范围',`<button class="back-link" onclick="showRegion('${province}')">${icon('back')}返回区县台账</button><section class="panel table-panel"><div class="panel-head"><h3>学校 / 单位参训情况</h3></div><div class="table-scroll"><table><thead><tr><th>单位</th><th>去重学员</th><th>参训人次</th><th>有效学时</th><th></th></tr></thead><tbody>${schools.map(s=>{const ls=ms.filter(m=>m.person.school===s);return`<tr><td>${s}</td><td>${unique(ls.map(m=>m.person.id)).length}</td><td>${ls.length}</td><td>${fmt(sum(ls,m=>m.hours),1)}</td><td><button class="text-link" onclick="showSchool('${s}')">学员名单 ${icon('arrow')}</button></td></tr>`}).join('')}</tbody></table></div></section>`)}
function showSchool(s){const ls=selected().flatMap(p=>p.learners).filter(m=>m.person.school===s);openModal(s+' · 学员名单','当前筛选范围 · 点击姓名查看个人档案',`<section class="panel table-panel">${peopleList(dedupMembers(ls))}</section>`)}
function showPeopleSubset(type,value){const all=dedupMembers(selected().flatMap(p=>p.learners)).filter(x=>type==='subject'?x.person.subject===value:ageGroup(ageFor(x.person))===value);openModal(value+' · 学员清单',`当前筛选范围共 ${fmt(all.length)} 人`, `<section class="panel table-panel">${peopleList(all)}</section>`)}
function showMonth(m){const ps=selected(),isHours=state.trend==='hours',rows=ps.map(p=>({p,v:isHours?(p.monthHours[m]||0):(p.monthEnroll[m]||0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);openModal(`${state.year} 年 ${m+1} 月 · ${isHours?'学习学时':'新增参训人次'}`,scopeText(),`<div class="note-box">当月合计 ${fmt(sum(rows,x=>x.v),isHours?1:0)} ${isHours?'学时':'人次'}，以下为各项目贡献明细。</div><section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>项目</th><th>客户类型</th><th>地区</th><th>${isHours?'当月有效学时':'当月新增人次'}</th><th></th></tr></thead><tbody>${rows.map(({p,v})=>`<tr><td>${p.name}</td><td>${p.type}</td><td>${p.province}</td><td>${fmt(v,1)}</td><td><button class="text-link" onclick="showProject('${p.id}')">项目详情</button></td></tr>`).join('')||'<tr><td colspan="5">本月暂无记录</td></tr>'}</tbody></table></div></section>`)}
const definitions=[
 ['scope','统计范围','全部指标随年度、客户类型、所属部门、地区联动。2026年演示数据截至10月29日，2025年截至12月31日。主任默认拥有全单位视图。'],

function showDictionary(key=''){let rows=definitions;if(key)rows=[...definitions.filter(x=>x[0]===key),...definitions.filter(x=>x[0]!==key)];openModal('指标口径与演示说明','本原型的统计规则及数据边界',`<div class="dictionary">${rows.map(([id,t,s])=>`<div class="definition"><strong>${t}</strong><p>${s}</p></div>`).join('')}</div>`)}
function showMetric(key){const d=stats(selected());if(key==='hours'){openModal('有效学时 · 项目贡献','累计与项目明细可核对',`<div class="note-box">有效学时合计 ${fmt(d.hours)}，去重学员 ${fmt(d.participants)} 人，人均 ${fmt(d.hours/(d.participants||1),1)} 学时。</div><section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>项目</th><th>参训人次</th><th>有效学时</th><th></th></tr></thead><tbody>${d.projects.map(p=>`<tr><td>${p.name}</td><td>${p.learners.length}</td><td>${fmt(p.hours)}</td><td><button class="text-link" onclick="showProject('${p.id}')">查看项目</button></td></tr>`).join('')}</tbody></table></div></section>`);return}
 if(['pass','graduation'].includes(key)){const ls=d.members.filter(m=>key==='pass'?m.passed:m.graduated);openModal(key==='pass'?'考核合格人员明细':'已结业人员明细',key==='pass'?`${unique(ls.map(m=>m.person.id)).length} 名去重合格学员 · 下方按项目展示参训记录`:`${ls.length} 条结业记录 · 下方按项目展示`, `<section class="panel table-panel">${memberTable(ls)}</section>`);return}
 if(key==='experts'){const ids=unique(d.projects.flatMap(p=>p.experts));openModal('项目关联入库专家',`当前范围 ${ids.length} 名专家 · 演示名单`, `<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>专家编号</th><th>姓名</th><th>专家类型</th><th>关联项目数</th></tr></thead><tbody>${ids.map((id,i)=>`<tr><td>${id}</td><td>${namesA[i%20]}老师</td><td>${['高校专家','教研员','骨干教师','行政专家'][i%4]}</td><td>${d.projects.filter(p=>p.experts.includes(id)).length}</td></tr>`).join('')}</tbody></table></div></section>`);return}
 if(key==='activities'){openModal('送教与入校指导',`当前范围累计 ${d.activities} 场`, `<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>项目</th><th>省份</th><th>已开展场次</th><th></th></tr></thead><tbody>${d.projects.filter(p=>p.activities).map(p=>`<tr><td>${p.name}</td><td>${p.province}</td><td>${p.activities}</td><td><button class="text-link" onclick="showProject('${p.id}')">项目详情</button></td></tr>`).join('')}</tbody></table></div></section>`);return}
 const ids=key==='registered'?d.people.filter(p=>p.registeredYear===Number(state.year)).map(p=>p.id):d.active.filter(id=>rand(id+(key==='dau'?0:91)+Number(state.year))>(key==='dau'?.89:.28));const ls=dedupMembers(d.members.filter(m=>ids.includes(m.person.id)));openModal(key==='dau'?'当日登录学员':key==='mau'?'当月活跃学员':'年度新增注册学员',`${ls.length} 人 · 行为记录为演示数据`, `<section class="panel table-panel">${peopleList(ls)}</section>`)}
const memberHeaders=['学员编号','姓名','手机号（脱敏）','单位','项目编号','项目名称','客户类型','省份','有效学时','应修学时','账号状态','考核成绩','是否结业'];
function memberRow(m){return[m.person.code,m.person.name,m.person.phone,m.person.school,m.project.id,m.project.name,m.project.type,m.project.province,m.hours,m.required,m.active?'已激活':'未激活',m.exam?m.score:'未参考',m.graduated?'是':'否']}
function downloadCSV(name,headers,rows){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv='\ufeff'+[headers,...rows].map(r=>r.map(quote).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'_'+state.year+'_演示数据.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选范围，可使用 Excel 打开')}
function exportProjects(all=false){const ps=all?selected():filteredProjects(stats(selected()));downloadCSV('项目执行明细',['项目编号','项目名称','客户类型','部门','省份','状态','参训人数','有效学时','学时完成率%','考核合格率%','健康度','关注事项'],ps.map(p=>[p.id,p.name,p.type,p.department,p.province,p.status,p.learners.length,p.hours,p.completion.toFixed(1),p.exam?p.passRate.toFixed(1):'',p.health??'',p.risk]))}
function exportPeople(){downloadCSV('学员培训明细',memberHeaders,selected().flatMap(p=>p.learners).map(memberRow))}

function exportRegions(){const d=stats(selected());downloadCSV('区域服务台账',['省份','项目数','覆盖区县','学校单位数','去重学员','人次','有效学时','考核合格率%'],provinces.filter(p=>!state.province||p===state.province).map(p=>{const s=stats(d.projects.filter(x=>x.province===p));return[p,s.projects.length,s.county.length,s.schools.length,s.participants,s.enrolments,s.hours,s.exam.length?s.passRate.toFixed(1):'']}))}
function showReport(){const d=stats(selected()),ps=[...d.projects].sort((a,b)=>(a.health??101)-(b.health??101));const body=`<div class="print-actions"><button class="btn" onclick="exportProjects(true)">${icon('download')}项目明细 CSV</button><button class="btn primary" onclick="printReport()">${icon('print')}打印 / 另存为 PDF</button></div><article class="report" id="reportBody"><div class="report-brand">励耘研修　年度成效报告</div><h2>${state.year} 年度研修成效概览</h2><p>${safe(scopeText())}　｜　统计截至 ${state.year==='2026'?'2026年10月29日':'2025年12月31日'}</p><div class="report-metrics">${[['在管项目',d.projects.length+' 个'],['覆盖学员',fmt(d.participants)+' 人'],['有效学时',fmt(d.hours)+' 学时'],['考核合格率',pct(d.passRate)],['结业率',pct(d.graduationRate)],['送教与入校指导',d.activities+' 场']].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('')}</div><h3>一、服务覆盖与培训结果</h3><p>本统计范围共开展 ${d.projects.length} 个项目，覆盖 ${d.regions.length} 个省份、${d.county.length} 个区县及 ${d.schools.length} 所学校／单位。累计参训 ${fmt(d.enrolments)} 人次，覆盖 ${fmt(d.participants)} 名去重学员，累计有效学习 ${fmt(d.hours)} 学时，形成 ${fmt(d.graduated.length)} 条结业记录。</p><h3>二、项目执行与关注事项</h3><table><thead><tr><th>项目</th><th>状态</th><th>学时完成率</th><th>考核合格率</th><th>健康度</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.name}</td><td>${p.status}</td><td>${pct(p.completion)}</td><td>${p.exam?pct(p.passRate):'—'}</td><td>${p.health??'未开班'}</td></tr>`).join('')||'<tr><td colspan="5">暂无项目</td></tr>'}</tbody></table><h3>三、后续关注</h3><p>当前 ${ps.filter(p=>p.health!==null&&p.health<70).length} 个项目健康度低于70分，建议核对学时未达标人员及项目进度；${ps.filter(p=>p.health!==null&&p.health>=70&&p.health<=85).length} 个项目需持续跟进。具体原因由项目负责人结合执行情况确认。</p><div class="report-foot">本报告为交互原型生成的演示报告。全部数据为虚构样本，不作为实际业务汇报或培训证明。口径以原型“数据口径”说明为准。</div></article>`;openModal('年度报告预览','可使用浏览器打印，选择“另存为PDF”导出',body)}
function printReport(){const report=document.getElementById('reportBody');if(!report)return;const win=window.open('','_blank');if(!win){toast('请允许打开新窗口后重试');return}const css=document.querySelector('style').textContent;win.document.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>${state.year}年度研修成效报告_演示</title><style>${css}body{background:white;padding:30px;max-width:1100px;margin:auto}.report{border:0}@page{size:A4;margin:15mm}@media print{body{padding:0}.report table{font-size:10px}.report h3{break-after:avoid}}</style></head><body>${report.outerHTML}</body></html>`);win.document.close();setTimeout(()=>{win.focus();win.print()},350)}
function showHelp(){openModal('原型使用说明','主任全单位视图 · 可离线打开的单文件HTML',`<section class="panel help-list"><div><strong>1. 筛选全部联动</strong><p>切换年度、客户类型、所属部门和服务地区，指标卡、图表和项目名单同时更新。无匹配数据时展示空状态，可点击“重置”恢复。</p></div><div><strong>2. 从总览查看明细</strong><p>点击核心指标查看名单或贡献明细；点击地区进入区县、单位和学员；点击项目查看学情，继续进入个人档案及演示证书。</p></div><div><strong>3. 演示文件导出</strong><p>“导出明细”生成带中文编码标记的CSV，可用Excel打开。“导出年度报告”打开报告预览，通过浏览器打印另存为PDF。</p></div><div><strong>4. 数据与功能边界</strong><p>这是本地交互原型，使用虚构示例数据，不连接真实平台，不发送消息，也不执行真实账号权限校验。项目健康度与统计假设可在“指标口径”查看。</p></div></section>`)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}

Object.assign(state,{coverage:'region',outcome:'pass',featureIds:null,evidenceOpen:false,reporting:false});
const asOfDate=()=>state.year==='2026'?'2026.10.29':'2025.12.31';
const whenLabel=()=>state.year==='2026'?'1—10月':'1—12月';
const numOrDash=(n,den,d=1)=>den?fmt(n,d):'—';
function reportMetric(label,value,unit,note,ico,action,emphasis=false){return`<button class="report-kpi ${emphasis?'emphasis':''}" onclick="${action}"><span class="metric-label">${icon(ico)}${label}</span><span class="metric-hint">↗</span><div class="metric-number"><b class="num">${value}</b><small>${unit}</small></div><div class="metric-note">${note}</div></button>`}
function chapterHead(n,title,sub,action=''){return`<div class="chapter-heading"><div><div class="chapter-title"><span class="chapter-index">${n}</span><h2>${title}</h2></div><p>${sub}</p></div>${action}</div>`}
function panelHeading(title,sub,action=''){return`<div class="panel-head"><div><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}</div>${action}</div>`}
function renderMobileNav(){document.getElementById('mobileNav').innerHTML=[['overview','chart','全景'],['regions','map','覆盖'],['projects','project','项目'],['people','users','学员']].map(([v,i,t])=>`<button class="${state.view===v?'active':''}" onclick="navigate('${v}')">${icon(i)}<span>${t}</span></button>`).join('')}
function renderNav(){document.getElementById('navigation').innerHTML=`<div class="nav-group">汇报视图</div>${[['overview','chart','年度成效全景'],['regions','map','服务覆盖台账']].map(([v,i,t])=>`<button class="${state.view===v?'active':''}" onclick="navigate('${v}')" aria-label="${t}">${icon(i)}<span class="nav-text">${t}</span></button>`).join('')}<div class="nav-group">数据依据</div>${[['projects','project','项目执行明细'],['people','users','学员培训记录']].map(([v,i,t])=>`<button class="${state.view===v?'active':''}" onclick="navigate('${v}')" aria-label="${t}">${icon(i)}<span class="nav-text">${t}</span></button>`).join('')}`}
function render(){const d=stats(selected());renderNav();renderMobileNav();const titles={overview:['主任办年度成效全景','聚焦服务规模、培训成效与代表项目，为年度汇报提供数据依据','年度成效全景'],projects:['项目执行明细','从汇总追溯项目执行、学情和待跟进事项','项目执行明细'],regions:['服务覆盖台账','按省份、区县与学校／单位查看当前范围服务记录','服务覆盖台账'],people:['学员培训记录','按学员去重查看参训记录及学习成果','学员培训记录']};const t=titles[state.view]||titles.overview;document.getElementById('pageTitle').textContent=t[0];document.getElementById('pageSubtitle').textContent=t[1];document.getElementById('crumbTitle').textContent=t[2];document.getElementById('scopeLabel').textContent=scopeText();document.getElementById('asOf').textContent=asOfDate();document.getElementById('footerPeriod').textContent=state.year+' 年度';document.getElementById('presentationScope').textContent=state.year+' 年 · '+scopeText();let out=state.view==='overview'?directorOverview(d):state.view==='regions'?regionPage(d):state.view==='projects'?projectPage(d):peoplePage(d);document.getElementById('content').innerHTML=out;hydrateIcons()}
function changeFilter(key,value){state[key]=value;state.page=1;state.peoplePage=1;state.search='';state.projectTab='all';state.featureIds=null;render()}
function resetFilters(){Object.assign(state,{year:'2026',client:'',department:'',province:'',projectTab:'all',search:'',page:1,peoplePage:1,featureIds:null,coverage:'region',outcome:'pass'});['year','client','department','province'].forEach(k=>document.getElementById(k).value=state[k]);render();toast('已恢复本年度、全单位、全部客户和地区')}
function applyProvince(p){changeFilter('province',p);document.getElementById('province').value=p;toast('当前范围已切换至'+p)}
function applyClient(t){changeFilter('client',t);document.getElementById('client').value=t;toast('当前范围已切换至'+t)}
function navigate(v){if(state.reporting)togglePresentation(false);state.view=v;state.page=1;state.peoplePage=1;state.search='';state.projectTab='all';render();window.scrollTo({top:0,behavior:'smooth'})}
function setCoverage(t){state.coverage=t;render()}
function setOutcome(t){state.outcome=t;render()}
function setEvidence(open){state.evidenceOpen=open}
function directorOverview(d){if(!d.projects.length)return`<section class="panel empty"><strong>当前筛选范围暂无匹配项目</strong><p>请调整客户类型、部门或服务地区，也可以恢复全单位视图。</p><button class="btn primary" style="margin-top:18px" onclick="resetFilters()">重置筛选</button></section>`;const started=d.projects.filter(p=>p.status!=='筹备中').length,types=unique(d.projects.map(p=>p.type)).length;return`
<section class="chapter" id="scale"><div class="report-hero"><div><div class="hero-label">ANNUAL SERVICE & LEARNING IMPACT</div><h2>${state.year} 年度服务与培训成效</h2><p>${safe(scopeText())} · 截至 ${asOfDate()}<br>服务 ${types} 类委托主体，覆盖 ${d.regions.length} 个省份、${d.county.length} 个区县，累计参训 ${fmt(d.enrolments)} 人次。以下呈现当前范围的服务覆盖、学习投入与结果达成。</p></div><div class="hero-right"><span>项目服务进展</span><b class="num">${started}<span class="hero-small">已开展项目</span></b><small>${d.projects.filter(p=>p.status==='已结班').length} 个已结班 · ${d.projects.filter(p=>p.status==='筹备中').length} 个筹备中</small></div></div>
<div class="report-kpis" aria-label="年度核心指标">
${reportMetric('服务项目',fmt(d.projects.length),'个',`${started} 已开展 · ${d.projects.length-started} 筹备`,'project',"navigate('projects')",true)}
${reportMetric('覆盖学员',fmt(d.participants),'人',`报名去重 · ${fmt(d.enrolments)} 参训人次`,'users',"navigate('people')")}
${reportMetric('覆盖省份',fmt(d.regions.length),'个',`${fmt(d.county.length)} 区县 · ${fmt(d.schools.length)} 学校／单位`,'map',"navigate('regions')")}
${reportMetric('累计有效学时',fmt(d.hours/10000,2),'万学时',`人均 ${fmt(d.hours/d.participants,1)} 学时`,'clock',"showMetric('hours')",true)}
${reportMetric('考核合格率',numOrDash(d.passRate,d.exam.length),'%',`合格 ${fmt(d.pass.length)} / 参考 ${fmt(d.exam.length)} 人`,'award',"showMetric('pass')")}
${reportMetric('结业率',numOrDash(d.graduationRate,d.enrolments),'%',`结业 ${fmt(d.graduated.length)} / 报名 ${fmt(d.enrolments)} 人次`,'school',"showMetric('graduation')")}
</div></section>
<section class="chapter" id="coverage">${chapterHead('01','服务覆盖与专业支撑','我们服务了谁，覆盖了哪里',`<button class="text-link" onclick="navigate('regions')">查看覆盖明细 ${icon('arrow')}</button>`)}<div class="report-grid"><section class="panel">${panelHeading('服务覆盖结构',state.coverage==='region'?'省内去重人数 · 点击地区联动当前范围':'参训人次占比 · 项目按主客户类型唯一归类',`<div class="seg"><button class="${state.coverage==='region'?'active':''}" onclick="setCoverage('region')">按地区</button><button class="${state.coverage==='client'?'active':''}" onclick="setCoverage('client')">按客户</button></div>`)}${coverageRows(d)}<div class="panel-bottom"><span>${state.coverage==='region'?`${d.regions.length} 个省份形成服务覆盖`:'客户结构按参训记录统计，人次可加总'}</span><button class="text-link" onclick="showDictionary('people')">查看口径</button></div></section>
<section class="panel">${panelHeading('专业资源与线下服务','将资源投入与服务触达一起呈现')}<div class="resources">${resourceTile('关联入库专家',d.experts,'名',"showMetric('experts')")}${resourceTile('送教与入校指导',d.activities,'场',"showMetric('activities')")}${resourceTile('服务学校／单位',d.schools.length,'所／家',"navigate('regions')")}${resourceTile('累计参训',d.enrolments,'人次',"navigate('people')")}</div><div class="resource-caption">专家为项目关联的去重入库专家；线下场次仅统计已发生的送教与入校指导。点击数字查看对应数据依据。</div></section></div></section>
<section class="chapter" id="effect">${chapterHead('02','培训投入与结果达成','学习投入与培训结果分别说明')}<div class="report-grid"><section class="panel">${panelHeading('年度学习趋势','按自然月统计 · 点击柱形查看项目贡献',`<div class="seg"><button class="${state.trend==='hours'?'active':''}" onclick="setTrend('hours')">学习学时</button><button class="${state.trend==='people'?'active':''}" onclick="setTrend('people')">参训人次</button></div>`)}<div class="trend-total"><strong class="num">${state.trend==='hours'?fmt(d.hours):fmt(d.enrolments)}</strong><small>${state.trend==='hours'?'累计有效学时':'累计参训人次'}</small><span class="trend-compare">${trendComparison(d)}</span></div><div class="chart-topline"><span><i class="legend-dot"></i>${state.trend==='hours'?'当月有效学时':'当月新增报名人次'}</span><span>${state.year}年 ${whenLabel()}</span></div><div class="chart-wrap">${trendChart(d)}</div><div class="panel-bottom"><span>月度合计可与当前累计及明细核对</span><button class="text-link" onclick="showDictionary('compare')">同比口径</button></div></section>
<section class="panel">${panelHeading('培训结果',state.outcome==='pass'?'同一学员跨项目去重 · 至少一次考核通过计合格':'按项目报名记录统计 · 包含尚未到期人员',`<div class="seg"><button class="${state.outcome==='pass'?'active':''}" onclick="setOutcome('pass')">考核</button><button class="${state.outcome==='graduation'?'active':''}" onclick="setOutcome('graduation')">结业</button></div>`)}${outcomeChart(d)}<div class="satisfaction"><span>项目满意度 <small>参训人次加权演示值</small></span><button onclick="showDictionary('satisfaction')"><b class="num">${fmt(d.satisfaction,2)}</b><span class="muted"> / 5</span></button></div></section></div></section>
<section class="chapter" id="showcase">${chapterHead('03','代表项目与成效依据','从整体数据进入具体项目',`<button class="text-link" onclick="showFeaturePicker()">选择展示项目 ${icon('arrow')}</button>`)}<div class="feature-grid">${featured(d).map(featureCard).join('')||'<section class="panel empty">当前范围暂无已开展项目，项目筹备信息可在明细中查看。</section>'}</div><div class="material-note">${icon('book')}<div><strong>成果材料待补齐</strong>　优秀作品、实践案例与成果汇编尚无可核查数据，当前以项目指标作为成效依据。</div><button class="text-link" onclick="showOutcomeNeeds()">查看补充项 ${icon('arrow')}</button></div></section>
<details class="evidence-disclosure" ${state.evidenceOpen?'open':''} ontoggle="setEvidence(this.open)"><summary><h3>平台活跃与学员画像 <span class="muted">· 补充数据</span></h3><small>日活、月活、注册、学科与年龄结构　⌄</small></summary><div class="evidence-kpis">${evidenceStat('当日登录 DAU',d.dau,'人',"showMetric('dau')")}${evidenceStat('当月活跃人数',d.mau,'人',"showMetric('mau')")}${evidenceStat('当月活跃率',fmt(d.mauRate,1),'%',"showDictionary('active')")}${evidenceStat('年度新增注册',d.registered,'人',"showMetric('registered')")}</div><div class="evidence-grid"><div><h3>学科结构 <span class="sub">去重学员主学科</span></h3>${subjectRows(d)}</div><div><h3>年龄结构 <span class="sub">所选年度末年龄</span></h3><div class="age-layout">${ageChart(d)}</div><p class="age-foot">演示样本年龄资料完整率100%</p></div></div></details>`}
function resourceTile(title,n,unit,action){return`<button class="resource-tile" onclick="${action}"><span>${title}</span><b class="num">${fmt(n)}</b><small>${unit}</small></button>`}
function evidenceStat(title,n,unit,action){return`<button onclick="${action}"><span>${title}</span><b class="num">${typeof n==='string'?n:fmt(n)}</b><small>${unit}</small></button>`}
function coverageRows(d){const byRegion=state.coverage==='region',labels=byRegion?provinces:['区域服务','央企','大学'];const rows=labels.map(name=>{const ps=d.projects.filter(p=>(byRegion?p.province:p.type)===name),ss=stats(ps);return{name,n:byRegion?ss.participants:ss.enrolments,projects:ps.length}}).filter(r=>r.projects).sort((a,b)=>b.n-a.n);const max=byRegion?Math.max(1,...rows.map(r=>r.n)):d.enrolments;return rows.map(r=>`<button class="service-row" onclick="${byRegion?'applyProvince':'applyClient'}('${r.name}')"><span class="place">${r.name}</span><div class="bar-track"><div class="bar-fill" style="width:${ratio(r.n,max)}%"></div></div><span class="value num">${fmt(r.n)}<small>${byRegion?'人':'人次'}</small></span>${icon('arrow')}</button>`).join('')}
function trendComparison(d){const old=compareStats();if(state.trend!=='hours')return'报名月份分布';if(!old.projects.length||!old.hours||state.year!=='2026')return'暂无上年同期可比数据';const v=(d.hours-old.hours)/old.hours*100;return`较上年1—10月 <b>${v>=0?'↑':'↓'} ${fmt(Math.abs(v),1)}%</b>`}
function outcomeChart(d){const pass=state.outcome==='pass',ok=pass?d.pass.length:d.graduated.length,total=pass?d.exam.length:d.enrolments,value=ratio(ok,total),circ=2*Math.PI*54;return`<div class="outcome-layout"><button class="result-donut" onclick="showMetric('${pass?'pass':'graduation'}')" aria-label="${pass?'查看考核合格人员':'查看结业记录'}"><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="54" stroke="#edf1ee" stroke-width="12" fill="none"/><circle cx="70" cy="70" r="54" stroke="#4f8a88" stroke-width="12" stroke-linecap="round" fill="none" stroke-dasharray="${circ*value/100} ${circ}"/></svg><span class="result-center"><b class="num">${total?pct(value):'—'}</b><small>${pass?'考核合格率':'结业率'}</small></span></button><div class="result-stats"><button onclick="showMetric('${pass?'pass':'graduation'}')"><span><i></i>${pass?'考核合格':'已结业'}</span><b class="num">${fmt(ok)}</b><small>${pass?'人':'人次'}</small></button><button class="pending" onclick="showResultRemainder('${pass?'pass':'graduation'}')"><span><i></i>${pass?'尚未合格':'尚未结业'}</span><b class="num">${fmt(total-ok)}</b><small>${pass?'人':'人次'}</small></button></div></div><p class="result-note">${pass?`参考 ${fmt(total)} 人；未参考的 ${fmt(d.participants-total)} 人不进入此分母。多项目考核的最终正式规则待确认。`:`当前已结业 ${fmt(ok)} 条／报名 ${fmt(total)} 条；尚未结业包含在训与筹备人员，不等同于项目失败。`}</p>`}
function showResultRemainder(key){const d=stats(selected());let rows;if(key==='pass'){const ids=new Set(d.exam.filter(id=>!d.pass.includes(id)));rows=d.members.filter(m=>ids.has(m.person.id)&&m.exam)}else rows=d.members.filter(m=>!m.graduated);openModal(key==='pass'?'参考但尚未合格的学员':'尚未结业的参训记录',key==='pass'?'跨项目去重判定，下方按项目展示考核记录':'包含在训、筹备与尚未达标人员，请结合项目周期判断',`<section class="panel table-panel">${memberTable(rows)}</section>`)}
function featured(d){const eligible=d.projects.filter(p=>p.status!=='筹备中');if(state.featureIds){const chosen=state.featureIds.map(id=>eligible.find(p=>p.id===id)).filter(Boolean);if(chosen.length)return chosen}const ranked=[...eligible].sort((a,b)=>b.graduated-a.graduated||b.hours-a.hours),chosen=[];for(const type of ['区域服务','央企','大学']){const p=ranked.find(p=>p.type===type);if(p)chosen.push(p)}for(const p of ranked)if(chosen.length<3&&!chosen.includes(p))chosen.push(p);return chosen.slice(0,3)}
function featureCard(p){return`<article class="feature-card"><div class="feature-top"><div class="feature-tags"><span class="feature-type">${p.type}</span><span class="feature-status">${p.status} · ${p.province}</span></div><h3>${safe(p.name)}</h3></div><div class="feature-body"><div class="feature-data"><div><b class="num">${fmt(p.learners.length)}</b><small>参训人次</small></div><div><b class="num">${p.exam?pct(p.passRate):'—'}</b><small>项目考核合格率</small></div></div><p class="feature-sentence">累计有效学习 ${fmt(p.hours)} 学时，形成 ${fmt(p.graduated)} 条结业记录；开展 ${p.activities} 场送教与入校指导。</p><div class="feature-foot"><span>${p.department} · 演示项目</span><button class="text-link" onclick="showProjectImpact('${p.id}')">查看项目成效 ${icon('arrow')}</button></div></div></article>`}
function showProjectImpact(id){const p=findProject(id);if(!p)return;const d=stats([p]);openModal(p.name+' · 项目成效',`${p.province} · ${p.type} · ${p.id} · 演示数据`, `<div class="report-kpis">${reportMetric('参训人数',fmt(p.learners.length),'人','项目内去重','users',`showProject('${id}','learners')`)}${reportMetric('有效学时',fmt(p.hours),'学时',`已激活 ${p.active} 人`,'clock',`showProject('${id}','learners')`)}${reportMetric('考核合格率',numOrDash(p.passRate,p.exam),'%',`${p.passed} 合格 / ${p.exam} 参考`,'award',`showProject('${id}','learners')`)}${reportMetric('已结业记录',fmt(p.graduated),'条',`报名 ${p.learners.length} 人`,'school',`showProject('${id}','learners')`)}</div><section class="panel"><h3>服务与培养情况</h3><p class="sub" style="margin:13px 0;line-height:2">该项目由${p.department}负责，覆盖 ${d.county.length} 个区县及 ${d.schools.length} 所学校／单位。关联 ${p.experts.length} 名入库专家，开展 ${p.activities} 场送教与入校指导。项目当前状态为${p.status}。</p><div class="detail-grid">${detail('委托甲方',p.client)}${detail('项目满意度',fmt(p.satisfaction,2)+' / 5（演示）')}${detail('个人应修学时',p.required+' 学时')}</div></section><section class="panel"><h3>成果材料</h3><p class="sub" style="margin:12px 0;line-height:1.9">优秀作品、实践案例、成果汇编等材料尚未提供。此处仅展示已有项目指标，不以结业记录替代实际成果评价。</p><button class="btn" onclick="showOutcomeNeeds()">查看成果数据补充项</button></section><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="showProject('${id}')">查看执行与学情明细</button><button class="btn primary" onclick="showReport()">进入汇报预览</button></div>`)}
function showFeaturePicker(){const d=stats(selected()),current=featured(d).map(p=>p.id);const ps=d.projects.filter(p=>p.status!=='筹备中');openModal('选择代表项目','最多选择3个 · 仅作用于当前筛选范围的页面和汇报预览',`<div class="focus-picker">${ps.map(p=>`<label><input type="checkbox" name="featured" value="${p.id}" ${current.includes(p.id)?'checked':''}><span><strong>${safe(p.name)}</strong><small>${p.type} · ${p.province} · ${p.status} · ${p.learners.length} 人次</small></span></label>`).join('')||'<p class="sub">当前范围没有已开展项目。</p>'}</div><div style="display:flex;justify-content:space-between;margin-top:18px;align-items:center"><button class="text-link" onclick="state.featureIds=null;closeModal();render()">恢复默认项目</button><button class="btn primary" onclick="saveFeatured()">应用展示项目</button></div>`)}
function saveFeatured(){const ids=[...document.querySelectorAll('input[name="featured"]:checked')].map(x=>x.value);if(!ids.length||ids.length>3){toast('请选择1—3个代表项目');return}state.featureIds=ids;closeModal();render();toast('页面与汇报预览的展示项目已更新')}
function showOutcomeNeeds(){openModal('成果材料的数据补充项','当前不生成虚构成果数量；以下字段确认后可接入成果展示',`<section class="panel table-panel"><div class="table-scroll"><table><thead><tr><th>补充项</th><th>需确认的内容</th></tr></thead><tbody><tr><td>成果归属</td><td>成果编号、项目编号、作者或单位、提交日期</td></tr><tr><td>类型与数量</td><td>教学设计、岗位实践、研究报告、成果汇编等；明确计件与去重规则</td></tr><tr><td>评审结果</td><td>评审标准、等级、评审人及通过状态，未评审与未通过分别标记</td></tr><tr><td>材料与展示权限</td><td>摘要、封面、附件或链接，以及是否允许对外汇报展示</td></tr><tr><td>应用与成效证据</td><td>实际应用情况、回访或评价依据；与学时、满意度分开说明</td></tr></tbody></table></div></section><div class="note-box">现阶段代表项目由既有项目、学员、有效学时和考核记录支撑。上述成果内容接入前不计入成果数量，也不自动推导社会效益结论。</div>`)}
function togglePresentation(on){const enabled=on===undefined?!state.reporting:on;if(enabled&&state.view!=='overview'){state.view='overview';render()}state.reporting=enabled;document.body.classList.toggle('reporting',enabled);window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.reporting&&document.getElementById('overlay').classList.contains('hidden'))togglePresentation(false)});
function reportHTML(d){const fs=featured(d);return`<article class="report" id="reportBody"><div class="report-brand">励耘研修　主任办年度服务与培训成效　｜　演示数据</div><h2>${state.year} 年度服务与培训成效报告</h2><p>${safe(scopeText())}　｜　统计截至 ${asOfDate()}　｜　全部数字为虚构演示样本</p><div class="report-metrics">${[['服务项目',fmt(d.projects.length)+' 个'],['覆盖学员',fmt(d.participants)+' 人'],['覆盖省份',d.regions.length+' 个'],['有效学时',fmt(d.hours)+' 学时'],['考核合格率',d.exam.length?pct(d.passRate):'—'],['结业率',d.enrolments?pct(d.graduationRate):'—']].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('')}</div><h3>一、服务规模与覆盖</h3><p>当前范围包含 ${d.projects.length} 个服务项目，其中 ${d.projects.filter(p=>p.status!=='筹备中').length} 个已开展、${d.projects.filter(p=>p.status==='筹备中').length} 个筹备。报名去重覆盖 ${fmt(d.participants)} 名学员，累计参训 ${fmt(d.enrolments)} 人次，覆盖 ${d.regions.length} 个省份、${d.county.length} 个区县和 ${d.schools.length} 所学校／单位。关联入库专家 ${d.experts} 名，开展送教与入校指导 ${d.activities} 场。</p><table><thead><tr><th>客户类型</th><th>项目数</th><th>参训人次</th><th>有效学时</th></tr></thead><tbody>${['区域服务','央企','大学'].map(t=>{const ps=d.projects.filter(p=>p.type===t);return`<tr><td>${t}</td><td>${ps.length}</td><td>${fmt(sum(ps,p=>p.learners.length))}</td><td>${fmt(sum(ps,p=>p.hours))}</td></tr>`}).join('')}</tbody></table><h3>二、学习投入与培训结果</h3><p>累计有效学习 ${fmt(d.hours)} 学时${d.participants?`，按去重学员计算人均 ${fmt(d.hours/d.participants,1)} 学时`:''}。${d.exam.length?`跨项目去重参考 ${fmt(d.exam.length)} 人，合格 ${fmt(d.pass.length)} 人，考核合格率 ${pct(d.passRate)}。`:'当前范围暂无参考记录，考核合格率不计算。'}已结业 ${fmt(d.graduated.length)} 条，报名 ${fmt(d.enrolments)} 条${d.enrolments?`，结业率 ${pct(d.graduationRate)}`:''}。此结业口径含尚未到期人员，需结合项目阶段理解。项目满意度为 ${d.enrolments?fmt(d.satisfaction,2)+' / 5':'暂无记录'}，为参训人次加权的演示值。</p><p>${comparisonSentence(d)}。月度累计与项目明细保持一致；同比仅在可比数据存在时展示。</p><h3>三、代表项目</h3>${fs.length?`<table><thead><tr><th>项目</th><th>类型／地区</th><th>参训人次</th><th>有效学时</th><th>已结业记录</th></tr></thead><tbody>${fs.map(p=>`<tr><td>${safe(p.name)}</td><td>${p.type}／${p.province}</td><td>${fmt(p.learners.length)}</td><td>${fmt(p.hours)}</td><td>${fmt(p.graduated)}</td></tr>`).join('')}</tbody></table>`:'<p>当前范围暂无已开展项目。</p>'}<h3>四、成果材料与口径说明</h3><p>优秀作品、实践案例、成果汇编及其评审结果尚未提供，当前以项目执行与学习记录作为数据依据，不生成实际成果数量。覆盖学员跨项目去重，参训人次按项目报名累计。考核合格口径为参考人员至少一条记录通过；结业按项目报名记录计算，均需在正式实施时确认。</p><div class="report-foot">本地交互原型 · 2026年11月4日版本。所有项目、人员与数值均为虚构演示内容，不作为实际年度汇报材料。当前筛选范围与代表项目选择已应用于本报告。</div></article>`}
function showReport(){const d=stats(selected());openModal('汇报预览与导出','使用当前年度、客户、部门和地区范围；可打印或另存为PDF',`<div class="print-actions"><button class="btn" onclick="exportSummary()">${icon('download')}导出指标 CSV</button><button class="btn" onclick="exportProjects(true)">${icon('download')}项目依据 CSV</button><button class="btn primary" onclick="printReport()">${icon('print')}打印 / 另存为PDF</button></div>${reportHTML(d)}`)}
function exportSummary(){const d=stats(selected());downloadCSV('主任办年度成效指标',['统计年度','截止日期','客户类型','部门','地区','指标','值','单位','口径'],[['服务项目',d.projects.length,'个','含筹备、在训、延期及已结班根项目'],['覆盖学员',d.participants,'人','报名人员跨项目去重'],['参训人次',d.enrolments,'人次','按项目报名记录累计'],['覆盖省份',d.regions.length,'个','当前报名人员服务省份去重'],['覆盖区县',d.county.length,'个','省份加区县去重'],['学校单位',d.schools.length,'所/家','按单位名称去重的演示口径'],['有效学时',d.hours,'学时','学员项目有效学时求和'],['考核合格率',d.exam.length?d.passRate.toFixed(1):'','%','去重合格/去重参考；至少一条通过计合格'],['结业率',d.enrolments?d.graduationRate.toFixed(1):'','%','已结业报名记录/全部报名记录；含未到期'],['关联专家',d.experts,'名','当前项目关联专家编号去重'],['送教入校指导',d.activities,'场','已发生线下送教及入校指导活动'],['满意度',d.enrolments?d.satisfaction.toFixed(2):'','分/5','按项目参训人次加权演示值']].map(r=>[state.year,asOfDate(),state.client||'全部',state.department||'全单位',state.province||'全部',...r]))}
const originScopeDefinition=definitions.find(d=>d[0]==='scope');originScopeDefinition[2]='所有汇报指标、图表、代表项目、下钻和导出随年度、客户类型、部门与地区联动。2026年演示样本截至10月29日，2025年截至12月31日；页面修改日期不改变数据截止日。';
definitions.find(d=>d[0]==='compare')[2]='本版仅在有效学时有上年可比样本时展示同比：2026年累计1—10月，对比2025年相同筛选范围的1—10月。2025年无2024年数据，不显示同比。项目数、人数、活动等不直接以本年截至期对比上年全年。';
definitions.find(d=>d[0]==='graduation')[2]='本演示结业率＝已结业项目报名记录÷当前范围全部报名记录，包含在训、尚未到期和筹备记录。学时达到要求且考核通过计结业。该口径是现有样本的演示假设，不等于合同约定应结业率；正式汇报需确认应结业范围与截止期。';
definitions.push(['outcomes','成果材料与代表项目','本版不编造作品数量、优秀成果、获奖或社会效益。代表项目默认兼顾当前范围客户类型，以结业记录和有效学时排序选取，用户可在当前范围内手动选择最多3项。成果类型、数量、评审、材料链接与对外展示权限待业务补充。']);
definitions.push(['presentation','汇报视图与数据依据','年度首页突出规模、覆盖与成效；项目风险和学员执行细节保留在数据依据中。汇报模式只调整界面排版，不更改数据和权限；所有页面及报告始终保留演示标识。CSV是明细数据，PDF通过浏览器打印导出。']);
function showHelp(){openModal('本地原型使用说明','主任办宣传汇报优化版 · 单文件HTML，可离线打开',`<section class="panel help-list"><div><strong>1. 从年度价值到项目依据</strong><p>首页依次展示服务规模、覆盖与专业支撑、学习投入与结果、代表项目。点击指标、图表或项目查看下钻；项目执行和学员记录在左侧数据依据中。</p></div><div><strong>2. 筛选与项目展示</strong><p>年度、客户类型、部门和地区联动所有指标与汇报。点击地区或客户条形也可筛选。“选择展示项目”可指定1—3个代表项目，筛选改变时恢复自动选择。</p></div><div><strong>3. 汇报模式和导出</strong><p>汇报模式收起工作台导航并放大主要内容，可用顶部章节定位，Esc退出。汇报预览提供指标CSV、项目依据CSV以及打印／另存PDF。</p></div><div><strong>4. 数据边界</strong><p>全部数字与人员均为虚构演示。沿用原有项目和人员样本，不连接真实系统；成果材料待补齐。考核、结业、同比及人群结构的假设可在指标口径中查阅。</p></div></section>`)}

function comparisonSentence(d){const old=compareStats();if(state.year!=='2026'||!old.projects.length||!old.hours)return'暂无上年同期可比数据';const change=(d.hours-old.hours)/old.hours*100;return'有效学时较上年1—10月'+(change>=0?'增长':'减少')+fmt(Math.abs(change),1)+'%'}

render();hydrateIcons();
</script>
</body>
</html>
